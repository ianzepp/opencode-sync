<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCode 对话浏览</title>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.11/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f5f5f5; color: #333; height: 100vh; display: flex; flex-direction: column;
}
header {
  background: #1a1a2e; color: #fff; padding: 12px 20px;
  display: flex; align-items: center; gap: 16px; flex-shrink: 0;
}
header h1 { font-size: 16px; white-space: nowrap; }
.search-box {
  flex: 1; display: flex; gap: 8px; max-width: 500px;
}
.search-box input {
  flex: 1; padding: 6px 12px; border: none; border-radius: 5px;
  font-size: 13px; outline: none;
}
.search-box button {
  padding: 6px 16px; border: none; border-radius: 5px;
  background: #e94560; color: #fff; cursor: pointer; font-size: 13px;
}
.search-box button:hover { background: #d63850; }
.stats { font-size: 12px; color: #aaa; white-space: nowrap; }
#app { display: flex; flex: 1; overflow: hidden; }

/* Project sidebar */
.panel-projects {
  width: 200px; background: #fff; border-right: 1px solid #e0e0e0;
  display: flex; flex-direction: column; flex-shrink: 0;
}
.panel-projects .header {
  padding: 10px 14px; border-bottom: 1px solid #e0e0e0;
  font-size: 12px; color: #999; font-weight: 600; text-transform: uppercase;
}
.project-item {
  padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f5f5f5;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; transition: background 0.15s;
}
.project-item:hover { background: #f0f4ff; }
.project-item.active { background: #dde8ff; font-weight: 600; }
.project-item .count {
  background: #e0e0e0; border-radius: 10px; padding: 1px 8px;
  font-size: 11px; color: #666;
}
.project-item.active .count { background: #b3c9ff; }

/* Conversation sidebar */
.panel-convs {
  width: 340px; background: #fafafa; border-right: 1px solid #e0e0e0;
  display: flex; flex-direction: column; flex-shrink: 0;
}
.panel-convs .header {
  padding: 10px 14px; border-bottom: 1px solid #e0e0e0;
  font-size: 13px; color: #666; font-weight: 600;
}
.conv-list { flex: 1; overflow-y: auto; }
.conv-item {
  padding: 10px 14px; border-bottom: 1px solid #f0f0f0;
  cursor: pointer; transition: background 0.15s;
}
.conv-item:hover { background: #f0f4ff; }
.conv-item.active { background: #dde8ff; border-left: 3px solid #1a73e8; }
.conv-item .title { font-size: 13px; font-weight: 500; }
.conv-item .snippet { font-size: 11px; color: #888; margin-top: 3px; }
.conv-item .meta { font-size: 11px; color: #aaa; margin-top: 2px; }

/* Main detail */
.panel-detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.detail-header {
  padding: 16px 24px; background: #fff; border-bottom: 1px solid #e0e0e0;
}
.detail-header h2 { font-size: 16px; }
.detail-header .meta { font-size: 12px; color: #888; margin-top: 3px; }
.messages { flex: 1; overflow-y: auto; padding: 12px 24px; }
.msg { margin-bottom: 12px; display: flex; flex-direction: column; }
.msg .role {
  font-size: 11px; font-weight: 600; margin-bottom: 3px;
  padding: 1px 8px; border-radius: 3px; display: inline-block; align-self: flex-start;
}
.msg.user .role { background: #e8f0fe; color: #1a73e8; }
.msg.assistant .role { background: #e6f4ea; color: #137333; }
.msg .body {
  background: #fff; padding: 10px 14px; border-radius: 6px;
  font-size: 13px; line-height: 1.6; word-break: break-word;
}
.msg .body h1, .msg .body h2, .msg .body h3, .msg .body h4 {
  margin: 8px 0 4px; font-size: 14px; font-weight: 600;
}
.msg .body h1 { font-size: 16px; }
.msg .body p { margin: 4px 0; }
.msg .body ul, .msg .body ol { margin: 4px 0; padding-left: 20px; }
.msg .body li { margin: 2px 0; }
.msg .body pre {
  background: #f6f8fa; padding: 8px 12px; border-radius: 4px;
  overflow-x: auto; font-size: 12px; line-height: 1.4; margin: 6px 0;
}
.msg .body code {
  background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 12px;
}
.msg .body pre code { background: none; padding: 0; }
.msg .body table { border-collapse: collapse; margin: 6px 0; font-size: 12px; width: 100%; }
.msg .body th, .msg .body td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
.msg .body th { background: #f6f8fa; font-weight: 600; }
.msg .body blockquote { border-left: 3px solid #ddd; margin: 4px 0; padding: 2px 10px; color: #666; }
.placeholder {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: #bbb; font-size: 14px; flex-direction: column; gap: 6px;
}
.placeholder .icon { font-size: 36px; opacity: 0.3; }
</style>
</head>
<body>
<header>
  <h1>OpenCode</h1>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索对话..." autofocus>
    <button id="searchBtn">搜索</button>
  </div>
  <select id="sourceSwitch" style="font-size:12px;padding:4px 8px;border:none;border-radius:4px;background:rgba(255,255,255,0.15);color:#fff;outline:none;cursor:pointer">
    <option value="">加载中...</option>
  </select>
  <span class="stats" id="stats"></span>
</header>
<div id="app">
  <div class="panel-projects">
    <div class="header">项目</div>
    <div id="projectList"></div>
  </div>
  <div class="panel-convs">
    <div class="header" id="convHeader">对话</div>
    <div class="conv-list" id="convList"></div>
  </div>
  <div class="panel-detail" id="panelDetail">
    <div class="placeholder" id="placeholder">
      <div class="icon">💬</div>
      <div>选择一个对话查看详情</div>
    </div>
  </div>
</div>
<script>
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const projectList = document.getElementById('projectList');
const convList = document.getElementById('convList');
const convHeader = document.getElementById('convHeader');
const panelDetail = document.getElementById('panelDetail');
const placeholder = document.getElementById('placeholder');
const stats = document.getElementById('stats');

let allSessions = [];
let currentProject = '';
let selectedId = null;
let currentSource = '';

function api(path) {
  return path + (currentSource ? (path.includes('?') ? '&' : '?') + 'source=' + encodeURIComponent(currentSource) : '');
}

async function loadSources() {
  const res = await fetch('/api/sources');
  const data = await res.json();
  const sel = document.getElementById('sourceSwitch');
  if (data.sources.length <= 1) { sel.style.display = 'none'; return; }
  sel.innerHTML = data.sources.map(s => `<option value="${s.id}">${s.label}</option>`).join('');
  currentSource = data.default;
  sel.value = currentSource;
  sel.onchange = () => { currentSource = sel.value; loadProjects(); };
}

async function loadProjects() {
  const res = await fetch('/api/projects');
  const data = await res.json();
  stats.textContent = `${data.projects.length} 个项目`;
  renderProjects(data.projects);
}

function renderProjects(projects) {
  projectList.innerHTML = projects.map(p => `
    <div class="project-item${currentProject === p.name ? ' active' : ''}" onclick="selectProject('${esc(p.name)}')">
      <span>📁 ${esc(p.name)}</span>
      <span class="count">${p.count}</span>
    </div>
  `).join('');
}

async function selectProject(name) {
  currentProject = name;
  selectedId = null;
  renderProjects(JSON.parse(document.getElementById('__projects').textContent));
  placeholder.style.display = 'flex';
  panelDetail.querySelector('.detail-header')?.remove();
  panelDetail.querySelector('.messages')?.remove();
  await loadConversations(name);
}

async function loadConversations(project) {
  const url = project ? api(`/api/conversations?project=${encodeURIComponent(project)}`) : api('/api/conversations');
  const res = await fetch(url);
  const data = await res.json();
  allSessions = data.conversations;
  convHeader.textContent = project ? `${project} (${data.total})` : `全部 (${data.total})`;
  renderConvList(allSessions);
}

function renderConvList(items) {
  convList.innerHTML = items.map(c => {
    const isActive = c.id === selectedId;
    return `<div class="conv-item${isActive ? ' active' : ''}" data-id="${c.id}" onclick="selectConv('${c.id}')">
      <div class="title">${esc(c.title || 'Untitled')}</div>
      <div class="meta">${c.updated ? new Date(c.updated).toLocaleString() : ''}</div>
    </div>`;
  }).join('');
}

async function selectConv(id) {
  selectedId = id;
  renderConvList(allSessions);

  const res = await fetch(api(`/api/conversations/${encodeURIComponent(id)}`));
  if (!res.ok) return;
  const conv = await res.json();

  placeholder.style.display = 'none';
  let header = panelDetail.querySelector('.detail-header');
  let msgs = panelDetail.querySelector('.messages');
  if (!header) {
    header = document.createElement('div');
    header.className = 'detail-header';
    panelDetail.insertBefore(header, panelDetail.firstChild);
  }
  if (!msgs) {
    msgs = document.createElement('div');
    msgs.className = 'messages';
    panelDetail.appendChild(msgs);
  }
  header.innerHTML = `
    <h2>${esc(conv.metadata.title)}</h2>
    <div class="meta">
      ${conv.messages.length} 条消息 · 📁 ${esc(conv.metadata.project)} ·
      ${new Date(conv.metadata.created).toLocaleString()}
    </div>`;
  msgs.innerHTML = conv.messages.map(m => `
    <div class="msg ${m.role}">
      <span class="role">${m.role === 'user' ? '用户' : 'AI'}</span>
      <div class="body">${marked.parse(m.summary.body || m.summary.title || '', { breaks: true, gfm: true })}</div>
    </div>
  `).join('');
}

async function doSearch() {
  const q = searchInput.value.trim();
  if (!q) { loadConversations(currentProject); return; }
  const res = await fetch(api(`/api/search?q=${encodeURIComponent(q)}`));
  const data = await res.json();
  allSessions = data.results.map(r => ({ id: r.sessionId, title: r.title, snippet: r.snippet, updated: 0 }));
  convHeader.textContent = `搜索结果 (${data.total})`;
  renderConvList(allSessions);
  if (data.results.length > 0) selectConv(data.results[0].sessionId);
}

let searchTimer;
searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 300); });
searchBtn.addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

(async () => {
  await loadSources();
  await loadProjects();
  await loadConversations('');
})();
</script>
</body>
</html>
